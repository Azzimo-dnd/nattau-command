    <path d="M413 291 l-21 28 15 18 -25 24 8 34" stroke-width="1.4"/>
    <path d="M183 451 l17-22 27 5 18-29" stroke-width="1.2"/>
  </g>
  <g fill="#1c1815" opacity=".08">
    <circle cx="74" cy="67" r="3"/><circle cx="148" cy="284" r="2"/><circle cx="312" cy="219" r="4"/>
