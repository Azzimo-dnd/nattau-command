<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="stone" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.028" numOctaves="5" seed="19" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="grain">
        <feFuncR type="gamma" amplitude="1.05" exponent="1.35" offset="-0.12"/>
        <feFuncG type="gamma" amplitude="1.02" exponent="1.35" offset="-0.14"/>
        <feFuncB type="gamma" amplitude="0.98" exponent="1.35" offset="-0.17"/>
        <feFuncA type="table" tableValues="0 0.34"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="soft-light" result="textured"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="7" stitchTiles="stitch" result="fine"/>
      <feDisplacementMap in="textured" in2="fine" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="light" cx="28%" cy="18%" r="90%">
      <stop offset="0" stop-color="#aaa094" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#6f655b" stop-opacity=".08"/>
      <stop offset="1" stop-color="#1c1815" stop-opacity=".18"/>
    </radialGradient>
  </defs>
  <g filter="url(#stone)">
    <rect width="512" height="512" fill="#70665d"/>
    <rect width="512" height="512" fill="url(#light)"/>
  </g>
  <g fill="none" stroke="#211d1a" stroke-linecap="round" opacity=".26">
