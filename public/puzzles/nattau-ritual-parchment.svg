<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8aa78"/>
      <stop offset="0.45" stop-color="#b08b5b"/>
      <stop offset="1" stop-color="#8a6845"/>
    </linearGradient>
    <filter id="fibers" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75 0.08" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0.55 0 0 0 0
                0 0.43 0 0 0
                0 0 0.28 0 0
                0 0 0 0.22 0" result="fibers"/>
      <feBlend in="SourceGraphic" in2="fibers" mode="multiply"/>
    </filter>
    <radialGradient id="stain">
      <stop offset="0" stop-color="#5f3d25" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5f3d25" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#paper)" filter="url(#fibers)"/>
  <ellipse cx="102" cy="126" rx="120" ry="92" fill="url(#stain)"/>
  <ellipse cx="407" cy="365" rx="150" ry="112" fill="url(#stain)" opacity=".72"/>
  <path d="M18 88 C96 70 166 93 246 76 S398 62 500 87" fill="none" stroke="#f2ddae" stroke-opacity=".08" stroke-width="5"/>
  <path d="M7 401 C91 383 159 412 247 393 S403 382 509 406" fill="none" stroke="#51341f" stroke-opacity=".09" stroke-width="7"/>
  <g fill="#563820" opacity=".12">
    <circle cx="74" cy="333" r="3"/>
    <circle cx="182" cy="205" r="2.5"/>
    <circle cx="345" cy="94" r="4"/>
    <circle cx="429" cy="238" r="2"/>
    <circle cx="298" cy="448" r="3"/>
  </g>
</svg>
